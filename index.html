            <h1 className="text-[2.65rem] font-black leading-[1.08] tracking-tight text-white sm:text-5xl md:text-7xl">
              마케팅, 디자인,<br />
              시스템까지<br />
              <span className="orange-text">사업에 필요한</span><br />
              <span className="orange-text">결과물을</span><br />
              빠르게 만듭니다.
            </h1>
            <p className="mt-7 max-w-2xl text-base leading-8 text-slate-300 md:text-xl md:leading-9">
              <span className="block">JIT MARKETING은 로컬 비즈니스의 홍보자료,</span>
              <span className="block">발표 PPT, 랜딩페이지, 업무관리 시스템을</span>
              <span className="block">기획부터 제작까지 돕는 실무형 제작 파트너입니다.</span>
            </p>
            <div className="mt-9 flex flex-col gap-3 sm:flex-row">
              <button onClick={() => go("portfolio")} className="btn inline-flex items-center justify-center gap-2 rounded-md bg-gradient-to-r from-jit-orange to-jit-red px-7 py-4 text-base font-black text-white shadow-glow">
                포트폴리오 보기 <iconify-icon icon="solar:arrow-down-bold" width="18"></iconify-icon>
              </button>
              <button onClick={() => go("contact")} className="btn inline-flex items-center justify-center gap-2 rounded-md border border-white/15 bg-white/5 px-7 py-4 text-base font-black text-white hover:bg-white/10">
                제작 문의하기 <iconify-icon icon="solar:chat-round-dots-bold" width="18"></iconify-icon>
              </button>
            </div>
          </div>
          <div className="grid gap-4">
            <div className="card-dark p-5 md:p-7">
              <div className="flex flex-col gap-3 border-b border-white/10 pb-5 sm:flex-row sm:items-center sm:justify-between">
                <div>
                  <p className="text-xs font-black tracking-[.18em] text-slate-500">CAPABILITY MAP</p>
                  <h3 className="mt-1 text-2xl font-black text-white">한 사람이 연결해 만든 결과물</h3>
                </div>
                <span className="rounded-md bg-orange-500/15 px-3 py-2 text-sm font-black text-orange-300">6 AREA</span>
              </div>
              <div className="mt-5 grid grid-cols-2 gap-3">
                {["PPT/제안서", "홍보 디자인", "마케팅 운영", "랜딩페이지", "업무 시스템", "자동화"].map((item) => (
                  <div key={item} className="rounded-md border border-white/10 bg-black/20 p-4">
                    <p className="text-sm font-black text-white">{item}</p>
                    <div className="mt-3 h-1.5 rounded-full bg-slate-800">
                      <div className="h-full w-4/5 rounded-full bg-gradient-to-r from-jit-orange to-jit-red"></div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
            <div className="grid grid-cols-3 gap-3">
              {[
                ["35", "확인한 GitHub 레포"],
                ["12", "대표 포트폴리오"],
                ["7", "제작 진행 단계"]
              ].map(([num, label]) => (
                <div key={label} className="card-dark p-4 text-center">
                  <p className="text-2xl font-black text-white md:text-3xl">{num}</p>
                  <p className="keep-all mt-1 text-xs font-bold leading-5 text-slate-500">{label}</p>
                </div>
              ))}
            </div>
          </div>
        </div>
      </section>
    );

    const About = () => (
      <section id="about" className="bg-white py-20 text-slate-900 md:py-28">
        <div className="mx-auto max-w-7xl px-6">
          <SectionTitle
            eyebrow="About JIT"
            title="예쁜 결과물보다, 실제 사업장에서 쓰이는 결과물을 만듭니다."
            desc="로컬 사업자의 마케팅과 운영 문제를 함께 이해하고, 광고 운영부터 디자인 제작, 보고서 작성, 랜딩페이지, 업무관리 시스템까지 연결해서 해결합니다."
          />
          <div className="grid gap-4 md:grid-cols-3">
            {[
              ["운영 이해", "매장과 현장에서 필요한 자료, 문의, 예약, 보고 흐름을 먼저 봅니다."],
              ["제작 연결", "PPT, 디자인, 웹, 시스템을 따로 보지 않고 하나의 실행 흐름으로 엮습니다."],
              ["빠른 실행", "큰 시스템보다 지금 바로 쓰이는 결과물을 우선 만들고 개선합니다."]
            ].map(([title, desc], i) => (
              <div key={title} className="reveal card-light p-6">
                <span className="mb-5 flex h-11 w-11 items-center justify-center rounded-md bg-orange-50 text-lg font-black text-orange-600">0{i + 1}</span>
                <h3 className="text-xl font-black">{title}</h3>
                <p className="keep-all mt-3 text-sm leading-7 text-slate-600">{desc}</p>
              </div>
            ))}
          </div>
        </div>
      </section>
    );

    const Services = () => (
      <section id="services" className="grain bg-[#09090D] py-20 md:py-28">
        <div className="relative z-10 mx-auto max-w-7xl px-6">
          <SectionTitle
            dark
            eyebrow="Services"
            title="필요한 결과물 단위로 바로 제작합니다."
            desc="정부지원사업 자료부터 로컬 홍보 디자인, 예약 페이지, 내부 관리 시스템까지 사업자가 이해하기 쉬운 단위로 정리했습니다."
          />
          <div className="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
            {services.map((service) => (
              <article key={service.title} className="reveal card-dark flex h-full flex-col p-6">
                <div className="mb-5 flex items-start justify-between gap-4">
                  <div className="flex h-12 w-12 items-center justify-center rounded-md border border-orange-500/25 bg-orange-500/10">
                    <iconify-icon icon={service.icon} width="25" style={{ color: "#FF5C1A" }}></iconify-icon>
                  </div>
                  <span className="rounded-full border border-white/10 px-3 py-1 text-xs font-black text-slate-400">JIT</span>
                </div>
                <h3 className="keep-all text-xl font-black text-white">{service.title}</h3>
                <p className="keep-all mt-2 text-sm font-semibold leading-6 text-orange-200/80">{service.lead}</p>
                <ul className="mt-6 grid gap-2 border-t border-white/10 pt-5">
                  {service.items.map((item) => (
                    <li key={item} className="flex gap-2 text-sm font-semibold text-slate-300">
                      <iconify-icon icon="solar:check-circle-bold" width="16" style={{ color: "#FF5C1A", flexShrink: 0, marginTop: "2px" }}></iconify-icon>
                      <span className="keep-all">{item}</span>
                    </li>
                  ))}
                </ul>
              </article>
            ))}
          </div>
        </div>
      </section>
    );

    const Portfolio = () => (
      <section id="portfolio" className="bg-[#F7F7F4] py-20 text-slate-950 md:py-28">
        <div className="mx-auto max-w-7xl px-6">
          <SectionTitle
            eyebrow="Portfolio"
            title="GitHub에서 확인한 작업을 바탕으로 정리한 포트폴리오"
            desc="확실히 확인된 범위만 반영했고, 개발 중이거나 연결 준비 단계인 작업은 MVP·프로토타입·기획 중으로 표시했습니다."
          />
          <div className="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
            {portfolio.map((project) => (
              <article key={project.name} className="reveal card-light flex h-full flex-col p-5">
                <div className="flex flex-wrap gap-2">
                  {project.tags.map((tag) => (
                    <span key={tag} className="rounded-full bg-slate-100 px-3 py-1 text-xs font-black text-slate-600">{tag}</span>
                  ))}
                </div>
                <h3 className="keep-all mt-5 text-xl font-black leading-snug">{project.name}</h3>
                <p className="keep-all mt-3 text-sm font-semibold leading-7 text-slate-600">{project.desc}</p>
                <div className="mt-5 rounded-md bg-slate-50 p-4">
                  <p className="text-xs font-black tracking-[.18em] text-slate-400">작업 범위</p>
                  <p className="keep-all mt-2 text-sm font-bold leading-6 text-slate-700">{project.scope}</p>
                </div>
                <div className="mt-auto flex items-center justify-between gap-3 pt-5">
                  <span className="rounded-md border border-orange-200 bg-orange-50 px-3 py-2 text-xs font-black text-orange-700">{project.status}</span>
                  <a href={project.link} target="_blank" rel="noreferrer" className="inline-flex items-center gap-1 text-sm font-black text-slate-900 hover:text-orange-600">
                    GitHub <iconify-icon icon="solar:arrow-right-up-linear" width="16"></iconify-icon>
                  </a>
                </div>
              </article>
            ))}
          </div>

          <div className="reveal mt-16 rounded-lg border border-slate-200 bg-white p-5 md:p-8">
            <div className="mb-6 flex flex-col gap-2 md:flex-row md:items-end md:justify-between">
              <div>
                <p className="text-xs font-black uppercase tracking-[.22em] text-orange-600">Repository Classification</p>
                <h3 className="mt-2 text-2xl font-black">분야별 확인 레포 정리</h3>
              </div>
              <p className="keep-all text-sm font-semibold text-slate-500">빈 레포, 의미 확인이 어려운 레포, 민감도가 있는 고객명은 페이지 본문에 과하게 노출하지 않았습니다.</p>
            </div>
            <div className="grid gap-3 md:grid-cols-2">
              {repoGroups.map((group) => (
                <div key={group.title} className="rounded-md border border-slate-200 bg-slate-50 p-4">
                  <h4 className="keep-all text-base font-black text-slate-900">{group.title}</h4>
                  <p className="keep-all mt-2 text-sm leading-6 text-slate-600">{group.note}</p>
                  <p className="mt-3 text-xs font-bold text-slate-400">{group.repos.join(" · ")}</p>
                </div>
              ))}
            </div>
          </div>
        </div>
      </section>
    );

    const Process = () => (
      <section id="process" className="grain bg-[#09090D] py-20 md:py-28">
        <div className="relative z-10 mx-auto max-w-7xl px-6">
          <SectionTitle
            dark
            eyebrow="Process"
            title="외주는 이렇게 진행합니다."
            desc="필요한 결과물이 명확하지 않아도 괜찮습니다. 범위를 함께 정리하고, 바로 사용할 수 있는 형태로 납품합니다."
          />
          <div className="grid gap-4 md:grid-cols-2 lg:grid-cols-4">
            {process.map(([num, title, desc], index) => (
              <article key={num} className={`reveal card-dark p-5 ${index === process.length - 1 ? "lg:col-span-2" : ""}`}>
                <p className="text-3xl font-black text-white/10">{num}</p>
                <h3 className="mt-3 text-xl font-black text-white">{title}</h3>
                <p className="keep-all mt-3 text-sm font-semibold leading-7 text-slate-400">{desc}</p>
              </article>
            ))}
          </div>
        </div>
      </section>
    );

    const Contact = () => {
      const [type, setType] = useState("PPT 제작 문의");
      const [status, setStatus] = useState("idle");
      const options = [
        ["PPT 제작 문의", "solar:presentation-graph-bold-duotone"],
        ["디자인 외주 문의", "solar:palette-bold-duotone"],
        ["시스템 제작 문의", "solar:code-square-bold-duotone"]
      ];
      const placeholder = useMemo(() => {
        if (type.includes("PPT")) return "예) 정부지원사업 발표자료가 필요합니다. 기존 사업계획서와 참고자료가 있습니다.";
        if (type.includes("디자인")) return "예) 네이버 플레이스 이미지와 카드뉴스를 정리하고 싶습니다.";
        return "예) 예약관리나 고객관리 화면이 필요합니다. 현재는 엑셀/카톡으로 관리 중입니다.";
      }, [type]);

      const submit = async (e) => {
        e.preventDefault();
        setStatus("sending");
        const data = new FormData(e.currentTarget);
        data.append("access_key", WEB3FORMS_KEY);
        data.append("subject", `[JIT MARKETING] ${type}`);
        data.append("inquiry_type", type);
        try {
          const res = await fetch("https://api.web3forms.com/submit", { method: "POST", body: data, headers: { Accept: "application/json" } });
          const json = await res.json();
          if (json.success) {
            setStatus("sent");
            e.currentTarget.reset();
          } else {
            setStatus("error");
          }
        } catch (error) {
          setStatus("error");
        }
      };

      return (
        <section id="contact" className="bg-white py-20 text-slate-950 md:py-28">
          <div className="mx-auto max-w-6xl px-6">
            <SectionTitle
              eyebrow="Contact"
              title="필요한 결과물이 명확하지 않아도 괜찮습니다."
              desc="현재 상황과 목표를 알려주시면 PPT, 디자인, 웹, 시스템 중 필요한 제작 범위를 함께 정리해드립니다."
            />
            <div className="grid gap-6 lg:grid-cols-[.85fr_1.15fr]">
              <div className="reveal card-light p-6">
                <h3 className="text-2xl font-black">문의 유형 선택</h3>
                <p className="keep-all mt-2 text-sm font-semibold leading-7 text-slate-600">버튼을 누르면 선택한 문의 유형이 신청 내용에 함께 반영됩니다.</p>
                <div className="mt-6 grid gap-3">
                  {options.map(([label, icon]) => (
                    <button key={label} onClick={() => setType(label)} className={`btn flex items-center gap-3 rounded-md border p-4 text-left ${type === label ? "border-orange-500 bg-orange-50 text-orange-700" : "border-slate-200 bg-white text-slate-800 hover:border-orange-300"}`}>
                      <iconify-icon icon={icon} width="24"></iconify-icon>
                      <span className="font-black">{label}</span>
                    </button>
                  ))}
                </div>
                <div className="mt-8 grid gap-3 rounded-md bg-slate-950 p-5 text-white">
                  <p className="text-xs font-black uppercase tracking-[.22em] text-orange-300">Direct</p>
                  <p className="font-bold">{CONTACT_PHONE}</p>
                  <p className="keep-all text-sm font-semibold text-slate-400">{CONTACT_ADDRESS}</p>
                </div>
              </div>
              <form onSubmit={submit} className="reveal card-light p-6 md:p-8">
                <div className="mb-5 rounded-md border border-orange-200 bg-orange-50 px-4 py-3 text-sm font-black text-orange-700">
                  선택한 문의 유형: {type}
                </div>
                <div className="grid gap-4 md:grid-cols-2">
                  <label className="grid gap-2 text-sm font-black text-slate-700">
                    업체명 / 성함
                    <input name="name" required className="rounded-md border border-slate-200 px-4 py-3 font-semibold outline-none focus:border-orange-500" placeholder="예) 홍길동" />
                  </label>
                  <label className="grid gap-2 text-sm font-black text-slate-700">
                    연락처
                    <input name="phone" required className="rounded-md border border-slate-200 px-4 py-3 font-semibold outline-none focus:border-orange-500" placeholder="010-0000-0000" />
                  </label>
                </div>
                <label className="mt-4 grid gap-2 text-sm font-black text-slate-700">
                  문의 내용
                  <textarea name="message" rows="6" className="rounded-md border border-slate-200 px-4 py-3 font-semibold leading-7 outline-none focus:border-orange-500" placeholder={placeholder}></textarea>
                </label>
                {status === "sent" && <p className="mt-4 rounded-md border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm font-black text-emerald-700">문의가 접수되었습니다. 확인 후 연락드릴게요.</p>}
                {status === "error" && <p className="mt-4 rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm font-black text-red-700">전송 중 문제가 생겼습니다. 전화 문의를 이용해주세요.</p>}
                <button disabled={status === "sending"} className="btn mt-5 inline-flex w-full items-center justify-center gap-2 rounded-md bg-gradient-to-r from-jit-orange to-jit-red px-7 py-4 text-base font-black text-white disabled:opacity-60">
                  {status === "sending" ? "전송 중..." : `${type} 보내기`}
                  <iconify-icon icon="solar:arrow-right-bold" width="18"></iconify-icon>
                </button>
              </form>
            </div>
          </div>
        </section>
      );
    };

    const Footer = ({ go }) => (
      <footer className="border-t border-white/10 bg-[#060609] py-10 text-slate-500">
        <div className="mx-auto flex max-w-7xl flex-col gap-6 px-6 md:flex-row md:items-center md:justify-between">
          <div>
            <img src={LOGO} alt="JIT MARKETING" className="mb-3 h-8 w-auto opacity-80" onError={(e) => e.currentTarget.style.display = "none"} />
            <p className="text-sm font-semibold">마케팅, 디자인, 웹, 시스템 제작 파트너</p>
          </div>
          <div className="flex flex-wrap gap-2">
            {["about", "services", "portfolio", "contact"].map((id) => (
              <button key={id} onClick={() => go(id)} className="rounded-md border border-white/10 px-3 py-2 text-xs font-black text-slate-400 hover:text-orange-300">
                {id}
              </button>
            ))}
          </div>
        </div>
      </footer>
    );

    const App = () => {
      const [active, setActive] = useState("");

      useEffect(() => {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) entry.target.classList.add("visible");
          });
        }, { threshold: 0.08, rootMargin: "0px 0px -60px 0px" });
        document.querySelectorAll(".reveal").forEach((el) => observer.observe(el));

        const ids = ["about", "services", "portfolio", "process", "contact"];
        const bar = document.getElementById("scroll-bar");
        const onScroll = () => {
          const max = document.documentElement.scrollHeight - window.innerHeight;
          if (bar && max > 0) bar.style.width = `${(window.scrollY / max) * 100}%`;
          let current = "";
          ids.forEach((id) => {
            const el = document.getElementById(id);
            if (el && window.scrollY >= el.offsetTop - 120) current = id;
          });
          setActive(current);
        };
        onScroll();
        window.addEventListener("scroll", onScroll, { passive: true });
        return () => {
          observer.disconnect();
          window.removeEventListener("scroll", onScroll);
        };
      }, []);

      const go = (id) => {
        const target = document.getElementById(id);
        if (!target) return;
        window.scrollTo({ top: target.getBoundingClientRect().top + window.scrollY - 86, behavior: "smooth" });
      };

      return (
        <div className="min-h-screen">
          <Nav go={go} active={active} />
          <Hero go={go} />
          <About />
          <Services />
          <Portfolio />
          <Process />
          <Contact />
          <Footer go={go} />
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
